# ─── Content guards (CI) ──────────────────────────────────────────────────────
#
# Runs the full guard surface — lint, build, test — on every pull request and
# push to main.  Every action version below is pinned to a release tag so CI
# behaviour does not drift when upstream publishes a new major.
#
# See also: scripts/hooks/pre-push (local hook that runs only the fast lint
# guards, no quota, no rate limit).

name: guards

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

env:
  BUN_VERSION: "1.3.11"

jobs:
  guards:
    name: Guard surface (lint → build → test → pytest)
    # The fleet switch (tools/ci-runner/README.md): set the RUNNER_LABEL repo variable
    # (=h-dev) to run on the self-hosted runner — free minutes, survives a billing
    # lapse; delete it to return to GitHub-hosted. || treats undefined/empty as falsy.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # nats-server is a HARD dependency of the local substrate (local-engine-parity, decision 3),
      # and the JetStream KV registry adapters are tested against a REAL server rather than a fake:
      # the failure they exist to prevent is a key the server accepts on write and loses on read,
      # which no fake reproduces. Without this step those suites skip — loudly, but skipped coverage
      # on the one substrate a laptop runs is not coverage.
      - name: Install nats-server (local-substrate fabric)
        run: |
          set -euo pipefail
          version=v2.14.4
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${version}/nats-server-${version}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo install "/tmp/nats-server-${version}-linux-amd64/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Lint (13 content guards + turbo lint)
        run: bun run lint

      - name: Build (Turborepo)
        run: bun run build

      - name: Test (JS vitest)
        run: bun run test

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Lint (Python ruff + import-linter hex contracts)
        run: make lint-py

      # Helm must be installed BEFORE the Python tests: h-cli's chart-render and golden tests
      # SKIP silently without it (6 of them), which is green-by-absence — a pass that proves
      # nothing. It is set up here, ahead of make test-py, for exactly that reason.
      - name: Set up Helm (required — h-cli chart tests skip silently without it)
        uses: azure/setup-helm@v4

      # Delegates to the Makefile so CI and a local run cannot drift — `make test-py` is the
      # single source of truth for the Python test surface (all 7 suites, h-cli included).
      # Do NOT re-list the suites here; the two lists had already diverged once, omitting
      # h-cli's 281 tests from `make test` and agent-server's 22 from both.
      - name: Test (Python — all 7 suites, via make test-py)
        run: make test-py
