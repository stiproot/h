apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: appconfig
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: http://localhost:9411/api/v2/spans
  nameResolution:
    component: "sqlite"
    version: "v1"
    configuration:
      connectionString: "/tmp/dapr-h-nr.db"
      busyTimeout: "10s"
