apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: claude
spec:
  type: conversation.openai
  version: v1
  metadata:
    - name: key
      secretKeyRef:
        name: LITELLM_API_KEY
        key: LITELLM_API_KEY
    - name: endpoint
      secretKeyRef:
        name: ANTHROPIC_BASE_URL
        key: ANTHROPIC_BASE_URL
    - name: model
      value: claude-haiku-4-5
auth:
  secretStore: secretstore
scopes:
  - claude-agent
