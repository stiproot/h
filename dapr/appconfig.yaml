apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: appconfig
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: http://zipkin:9411/api/v2/spans
  # Name resolution: use the SQLite resolver (shared DB on the `dapr-nr` volume, mounted into every
  # sidecar) instead of the self-hosted default (mDNS). mDNS caches a callee's (IP, internal-gRPC
  # port); on `--force-recreate` the new sidecar comes up on a fresh ephemeral port while the cached
  # entry still points at the old one → `connection refused` until the TTL expires. The SQLite
  # resolver re-registers the current address on start, so lookups get the fresh port immediately.
  # Mirrors dapr/local/appconfig.yaml (host-run mode). busyTimeout retries on SQLITE_BUSY instead of
  # fataling under concurrent lease renewal (see the 2026-07-05 NR incident in CLAUDE.md).
  nameResolution:
    component: "sqlite"
    version: "v1"
    configuration:
      connectionString: "/nr/dapr-h-nr.db"
      busyTimeout: "10s"
