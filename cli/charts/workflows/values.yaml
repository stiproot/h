# Values for the h workflows chart. Shared knobs sit at the top level; each workflow
# template gets its own block, consumed by its template under templates/.
#
# Org-specific defaults (real repo paths, model ids) belong in values.local.yaml next to
# this file — gitignored, merged automatically by the invoke scripts — not here.

# Agent that provisions worktrees and executes setup / run steps.
agentId: claude-agent

# Activity that runs a template's plan/implement/verify steps. Defaults to run-claude; set to
# run-openhands to run the flow on the openhands-agent (pair with agentId: openhands-agent so the
# worktree/setup steps run there too).
runActivity: run-claude

# Publish mode: emit per-run inputs as {{params.*}} engine tokens (and omit the instanceId)
# so the render is a parameterized *template* for save_workflow, fired later with
# run_saved_workflow + fire-time params. Template config still bakes in from values.
publish: false

# Composable (overlay) mode: render a template as an overlay-able atom — omit the standalone
# closers a create-pr/verify overlay will supply (feature ends its implement step neutrally at
# the plan). Set by `h template compose`; see docs/plans/workflow-composition.md.
composable: false

# implement workflow (templates/implement.tmpl.yaml): worktree → setup → plan → implement. A pure atom —
# it neither verifies nor opens a PR (compose the verify / create-pr templates for those).
implement:
  # Git-branch-safe token; the run works on branch feature/<slug>. Required at render time.
  slug: ""
  # The Markdown feature spec. Required — pass with --set-file implement.spec=<path.md>.
  spec: ""
  # GitHub repo (owner/name) this run targets — the wf-registry identity segment (wf:<repo>:…).
  # Identity only; does NOT drive the clone (that is clonePath). Empty = no identity row (opt-in);
  # supply per fire with -p repo=owner/name, or set an org default in values.local.yaml.
  repo: ""
  # Local path of the pre-cloned target repo (NOT a GitHub owner/name). LEAVE EMPTY (the default) —
  # the agent's /worktree route then uses <sharedRoot>/repo, resolved from AGENT_BASE_DIR per mode,
  # so the same workflow runs in host AND compose without a mode-specific value (host
  # …/h-workspace/repo ≡ compose /workspace/repo via the bind mount). Set ONLY for a repo pre-cloned
  # to a non-default path. Baking a mode-specific path here breaks host⇄compose interchangeability.
  clonePath: ""
  # Branch refreshed from origin before cutting feature/<slug>; empty = the agent default (main).
  remoteBase: ""
  # Git auth strategy NAME for the worktree/clone steps and the epilogue's push instruction:
  # "" = the agent's default (GIT_AUTH env, pat when unset), "pat" = one-shot GH_TOKEN URL,
  # "ssh" = ssh transport (agent-mounted key via GIT_SSH_KEY_PATH; push is plain `git push
  # origin`). Template config — bakes at publish time; secrets never render.
  gitAuth: ""
  # Per-step model overrides; empty = the agent's AGENT_MODEL.
  models:
    plan: claude-sonnet-4-6
    implement: claude-haiku-4-5

# verify overlay template (templates/verify.tmpl.yaml): an acceptance check that gates the run,
# extending a composable implement's implement step. Replaces implement.verifyCmd — verification is
# only ever composed in (`h template compose implement verify create-pr`).
verify:
  # Acceptance command (e.g. "bun install && bun run lint"), run in the worktree by the implement
  # agent after the change; a failure stops the run before any commit/PR. Required when composed.
  cmd: ""

# create-pr overlay template (templates/create-pr.tmpl.yaml): the commit/push/open-PR epilogue as an
# overlay fragment that extends a composable implement's implement step. Publish-native — slug and
# issueNumber are fire-time {{params.*}}; only gitAuth bakes here (mirrors implement.gitAuth: "" =
# agent default, "pat" = one-shot GH_TOKEN URL, "ssh" = ssh transport).
createPr:
  gitAuth: ""

# arm-revise overlay template (templates/arm-revise-pr.tmpl.yaml): the "arm at birth" step
# (docs/plans/workflow-watcher-registry.md §10, Job 2). Appended after implement, it registers a
# revise-until-merged recur cron for the PR the run just opened — via the register-cron activity
# (the arm-* pattern), not the fire edge. cadence/maxFires are execution machinery, baked here.
armRevisePr:
  # How often the revise cron re-fires until the PR merges (5-field cron, UTC).
  cadence: "0 */6 * * *"
  # Budget backstop — stop re-firing revise after this many attempts even if the PR never merges.
  maxFires: 20

# improve-plugin workflow (templates/improve-plugin.tmpl.yaml): worktree → setup →
# improve (→ verify). Publish-native — always rendered as a template with {{params.slug}} /
# {{params.feedback}} slots; see the template header.
improvePlugin:
  # Local path of the pre-cloned plugin source repo; empty = the agent's default shared clone.
  clonePath: ""
  # Plugin source dir within the repo (the plugin name is its last path segment). Required.
  tile: ""
  # Branch refreshed from origin before cutting improve/<slug>; empty = the agent default (main).
  remoteBase: ""
  # Acceptance command for the optional trailing verify step; empty = no verify step.
  verifyCmd: ""
  # Per-step model overrides; empty = the agent's AGENT_MODEL.
  models:
    improve: ""
    verify: ""

# revise workflow (templates/revise-pr.tmpl.yaml): worktree → setup → revise. Publish-native — always
# rendered as a template with {{params.pr}} / {{params.slug}} slots. A standalone, first-class
# workflow that reads a PR's unresolved review threads itself and addresses them.
revisePr:
  # GitHub repo (owner/name) this run targets — the wf-registry identity segment. Identity only;
  # does NOT drive the clone (that is clonePath). Empty = no identity row (opt-in); -p repo=… per fire.
  repo: ""
  # Local path of the pre-cloned target repo in the shared agent workspace; empty = the agent's default clone.
  clonePath: ""
  # Branch refreshed from origin before checking out feature/<slug>; empty = agent default (main).
  remoteBase: ""
  # Git auth for the worktree + push (mirrors implement.gitAuth: "" = agent default, "pat", "ssh").
  gitAuth: ""
  # Floor command for step 3b's acceptance gate (e.g. "bun install && bun run build && bun run test").
  # Empty = no floor command; the gate itself is always present — the agent must deduce and run the
  # target repo's full acceptance suite from its own context. Bake from values.local.yaml.
  verifyCmd: ""
  # Per-step model override; empty = the agent's AGENT_MODEL.
  models:
    revise: ""

# Plugin provisioning. Marketplaces are curated config baked at publish time (trust split:
# sources are config, not fire-time params). Which plugins to install is fire-time content:
# the `plugins` param (space-separated name@marketplace tokens). Empty/absent → no-op.
plugins: {}
  # marketplaces:
  #   - https://example.com/marketplace.json

# bootstrap-repo workflow (templates/bootstrap-repo.tmpl.yaml): setup → bootstrap. Publish-native
# — creates a new GitHub repository from a spec, scaffolds, verifies, and pushes. No worktree,
# no pre-cloned repo, no PR flow in v1 (the owner gates the repo post-run).
bootstrapRepo:
  # Default repository visibility for newly created repos.
  visibility: private
  # Per-step model override; empty = the agent's AGENT_MODEL.
  models:
    run: ""

# review-pr workflow (templates/review-pr.tmpl.yaml): setup → review. Publish-native — always
# rendered as a template with {{params.pr}} / {{params.focus}} slots.
reviewPr:
  # Target GitHub repo (owner/name) whose PR is reviewed. Required.
  repo: ""
  # Optional: the original feature spec the PR was implementing. When set, the review checks
  # the diff satisfies THE SPEC, not merely the PR's self-description. Empty = spec-less review
  # (identical render to the no-spec default — the chain passes this through when present).
  spec: ""
  # Per-step model overrides; empty = the agent's AGENT_MODEL.
  models:
    review: ""

# answer workflow (templates/answer.tmpl.yaml): one bare "answer this task" step — the panelizable
# degenerate case (docs/plans/panels-as-a-modifier.md; successor of the retired agent-panel).
# Identity is fire-time params; an --agent roster panelizes it at fire time.
answer:
  models:
    # Model for a single-executor run (opens the modelAnswer slot); empty = the agent's
    # AGENT_MODEL. A panel run strips per-branch models (each panelist uses its own default).
    answer: ""

# plan workflow (templates/plan.tmpl.yaml): implement's planning half, split out so the plan is a
# chain-visible artifact — a distinct planning agent, and a panel review of the plan before it
# becomes a prompt (docs/plans/chain-plan-atom.md, docs/plans/spec-review-pipeline.md).
plan:
  # Git-branch-safe token; the run reads a worktree on branch feature/<slug>. Required at render.
  slug: ""
  # The Markdown spec to plan against. Required — pass with --set-file plan.spec=<path.md>.
  spec: ""
  # GitHub repo (owner/name) — the wf-registry identity segment. Identity only; does NOT drive
  # the clone (that is clonePath). Empty = no identity row (opt-in).
  repo: ""
  # Local path of the pre-cloned target repo. LEAVE EMPTY — see implement.clonePath above for why
  # baking a mode-specific path breaks host⇄compose interchangeability.
  clonePath: ""
  # Branch refreshed from origin before cutting feature/<slug>; empty = the agent default (main).
  remoteBase: ""
  # Git auth strategy NAME for the worktree step; "" = the agent's default (GIT_AUTH env).
  gitAuth: ""
  # Per-step model overrides; empty = the agent's AGENT_MODEL. Planning is the reasoning-heavy
  # half, so it defaults to the stronger model — same choice implement.models.plan makes.
  models:
    plan: claude-sonnet-4-6
