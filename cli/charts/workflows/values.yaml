# Values for the h workflows chart. Shared knobs sit at the top level; each workflow
# family gets its own block, consumed by its template under templates/.
#
# Org-specific defaults (real repo paths, model ids) belong in values.local.yaml next to
# this file — gitignored, merged automatically by the invoke scripts — not here.

# Agent that provisions worktrees and executes setup / run steps.
agentId: claude-agent

# Publish mode: emit per-run inputs as {{params.*}} engine tokens (and omit the instanceId)
# so the render is a parameterized *family* for save_workflow, fired later with
# run_saved_workflow + fire-time params. Family config still bakes in from values.
publish: false

# feature workflow (templates/feature.yaml): worktree → setup → plan → implement (→ verify).
feature:
  # Git-branch-safe token; the run works on branch feature/<slug>. Required at render time.
  slug: ""
  # The Markdown feature spec. Required — pass with --set-file feature.spec=<path.md>.
  spec: ""
  # Path of the pre-cloned target repo; empty = the agent's default shared clone.
  sourceRepo: ""
  # Branch refreshed from origin before cutting feature/<slug>; empty = the agent default (main).
  remoteBase: ""
  # Shell command that proves the implementation (e.g. "bun install && bun run lint"), run in
  # the worktree by a trailing verify step that fixes forward until it passes (≤3 attempts) and
  # ends with a ===VERIFY=== PASS/FAIL verdict. Empty = no verify step; the implement step's
  # self-report then goes unchecked.
  verifyCmd: ""
  # Append a commit/push/PR epilogue to the run's final step (verify when verifyCmd is set,
  # else implement): the agent commits the worktree, pushes feature/<slug> with a one-shot
  # $GH_TOKEN URL (never persisted), and opens the PR via the github MCP, ending with a
  # ===PR=== marker. Direct renders opt in here (--set feature.createPr=true / `h feature
  # run --pr`); a published family always carries the epilogue keyed off the fire-time param
  # instead — -p createPr=true (absent = worktree-only run).
  createPr: false
  # GitHub issue number this run implements. When set (and the PR epilogue runs), the PR body
  # carries `Closes #N` so the merge auto-closes the issue. Publish mode leaves it open as the
  # fire-time param issueNumber instead.
  issueNumber: ""
  # Git auth strategy NAME for the worktree/clone steps and the epilogue's push instruction:
  # "" = the agent's default (GIT_AUTH env, pat when unset), "pat" = one-shot GH_TOKEN URL,
  # "ssh" = ssh transport (agent-mounted key via GIT_SSH_KEY_PATH; push is plain `git push
  # origin`). Family config — bakes at publish time; secrets never render.
  gitAuth: ""
  # Per-step model overrides; empty = the agent's AGENT_MODEL.
  models:
    plan: claude-sonnet-4-6
    implement: claude-haiku-4-5
    verify: ""

# plugin-improvement workflow (templates/plugin-improvement.yaml): worktree → setup →
# improve (→ verify). Publish-native — always rendered as a family with {{params.slug}} /
# {{params.feedback}} slots; see the template header.
pluginImprovement:
  # Pre-cloned plugin source repo; empty = the agent's default shared clone.
  sourceRepo: ""
  # Plugin source dir within the repo (the plugin name is its last path segment). Required.
  tile: ""
  # Branch refreshed from origin before cutting improve/<slug>; empty = the agent default (main).
  remoteBase: ""
  # Acceptance command for the optional trailing verify step; empty = no verify step.
  verifyCmd: ""
  # Per-step model overrides; empty = the agent's AGENT_MODEL.
  models:
    improve: ""
    verify: ""

# issue-sweep workflow (templates/issue-sweep.yaml): setup → sweep — one judgment tick of the
# "h builds h" loop (docs/plans/h-builds-h.md). Publish with a cron schedule + a stable
# workspaceId, disabled until armed. Runtime knobs (enabled, budgets, attempt cap) live in the
# statestore key h-auto:config, not here.
issueSweep:
  # Target GitHub repo (owner/name) whose issue board drives the loop. Required.
  repo: ""
  # Maintainer-applied opt-in label that admits an issue's text to the loop.
  label: "agent-approved"
  # Max issues in flight at once; the sweep stops when reached.
  maxInFlight: 1
  # The coding agent service's standard POST /workflow URL (submit-and-babysit target),
  # e.g. http://localhost:8002/workflow locally, http://claude-coder:8000/workflow in compose.
  # Required.
  coderWorkflowUrl: ""
  # Stop after composing the spec: report what would fire, write/dispatch nothing.
  dryRun: false
  # Model for the sweep tick; cheap-but-capable (it follows an 9-step checklist).
  models:
    sweep: claude-sonnet-4-6
