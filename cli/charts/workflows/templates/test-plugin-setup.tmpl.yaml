{{- /*
test-plugin-setup — throwaway template for testing h.pluginSetupSteps.
Not a real workflow; renders a minimal setup step that exercises both h.setupSteps and
h.pluginSetupSteps. The real consumer lands with the bootstrap-repo template (separate spec).
*/ -}}
{{- if eq (.Values.template | default "") "test-plugin-setup" }}
role: standalone
summary: Throwaway — exercise h.setupSteps + h.pluginSetupSteps provisioning.
steps:
  - id: setup
    activity: setup
    input:
      agentId: {{ .Values.agentId | quote }}
      setup:
        {{- include "h.setupSteps" . | nindent 8 }}
        {{- include "h.pluginSetupSteps" . | nindent 8 }}
{{- end }}
