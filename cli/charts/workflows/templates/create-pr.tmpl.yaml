{{- /*
create-pr overlay template — the push / open-PR / respond-to-review step as an
overlay fragment that APPENDS a new `create-pr` step after the implement/itest steps.

This is a SPATIAL-composition (overlay) atom, not a standalone workflow: it renders a single
`create-pr` step carrying the push and PR epilogue. The implementation step commits locally
(composable mode) and a composed-in create-pr step owns the push and PR opening — producing
the order: implement (commits locally) → itest (machine gate) → create-pr (push + open PR).
A red itest gate fails the workflow BEFORE create-pr fires; no PR is opened for a failed run.
Composing create-pr IS the intent to open a PR: there is no opt-in flag (the retired
`feature --pr`/`createPr` nuance is gone). If you want a PR, you compose one in.

Publish-native: slug / issueNumber are {{params.*}} engine tokens resolved at fire time. Only
gitAuth bakes from values at publish time (a secret-adjacent knob, never a fire-time param).
issueNumber is optional — provide it (`-p issueNumber=N`) for a `Closes #N` PR body; omit it
for a PR that closes no issue. runActivity resolves from implement's base params block via the
overlay key-wise union (no params: block needed here).

Compose (the intended path):
  h template compose implement verify run-itest create-pr arm-revise-pr --save implement-pr
Render alone (for inspection):
  helm template create-pr cli/charts/workflows -s templates/create-pr.tmpl.yaml --set template=create-pr
*/ -}}
{{- /*
The declared output contract (structured-workflow-outputs plan): the workflow's typed output
signature, rendered three ways below — the step's outputContract input (validated at the run
activity, rung 2), the schema-derived task epilogue (steering that cannot drift), and the
top-level outputs: block (the registration surface). A run that cannot open a PR reports `skipped`
instead of pr/url, so those fields remain optional and the chain fails loud downstream exactly
like the marker-era SKIPPED tail. `closes` alone is required because it is always reportable as
`[]`, even when the run skips or the PR body closes nothing.
*/ -}}
{{- define "h.contract.create-pr" -}}
type: object
properties:
  pr:
    type: integer
    description: the pull request number, when a PR exists (opened, updated, or pre-existing)
  url:
    type: string
    description: the pull request URL
  base:
    type: string
    description: the PR's base branch AS GITHUB REPORTS IT after opening/updating (read it back from the PR, never echo the requested one) — a driver asserts it against the campaign's branch
  head:
    type: string
    description: the PR's head branch as GitHub reports it
  closes:
    type: array
    items:
      type: integer
    description: "the issue numbers the PR body closes, parsed from `Closes #N` lines READ BACK from the PR (never echoed from the requested issueNumber) — `[]` when the body closes nothing or no PR exists"
  skipped:
    type: string
    description: present INSTEAD of pr/url — why no PR exists (verify gate failed, auth failure, nothing to push, ...)
required:
  - closes
{{- end }}
{{- /* Template gate — see implement.tmpl.yaml: bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "create-pr" }}
role: overlay
summary: Overlay — append the push / open-PR / respond-to-review finishing step.
{{- $c := .Values.createPr }}
{{- $slug := include "h.token" "params.slug" }}
{{- $issueNumber := include "h.token" "params.issueNumber" }}
{{- $contract := include "h.contract.create-pr" . | fromYaml }}
{{- /*
The params block is a CONTRACT, not just defaults: `h chain run` validates every
`{{params.X}}` a member's definition references against it, so an OPTIONAL param that is
missing here reads as REQUIRED and refuses the chain at registration. `issueNumber` is
optional by design (it only adds `Closes #N` to the PR body) but carried no default, so any
chain member composing create-pr with declared `--input`s was rejected with "references
{{params.issueNumber}}, which nothing supplies" — found live 2026-08-06 on the first
plan → review → implement chain. An empty default is the author-sanctioned "optional" mark;
`slug` stays absent because it genuinely is required.
*/}}
params:
  issueNumber: ""
  {{- /*
  The PR's BASE. Empty means the repository's default branch, which is the right default and was
  the only behaviour until 2026-09-01. It became a param the first time a batch of runs had to
  land somewhere other than main — an integration branch collecting a night's work, reviewed as
  one merge rather than N. A values-baked field could not serve that: the base is a property of
  the CAMPAIGN, not of the repo, so it has to be settable per fire. */}}
  baseBranch: ""
steps:
  - id: create-pr
    activity: {{ include "h.token" "params.runActivity" | quote }}
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with .Values.implement.models.implement }}
      model: {{ include "h.token" "params.modelImplement" | quote }}
      {{- end }}
      outputContract: {{ $contract | toJson }}
      task: |-
        ===ISSUE===
        {{ $issueNumber }}

        The implementation step has committed the changes locally on branch feature/{{ $slug }}.
        Read plan-feature-{{ $slug }}.md in the worktree root and the local commit on
        feature/{{ $slug }} to understand what the implementation step did — use these as your
        sources for the PR title and body. Now push and open (or update) a pull request.
        {{- if eq ($c.gitAuth | default "") "ssh" }}
        1. Push the branch: git push origin feature/{{ $slug }} — the origin remote's SSH
           transport is already authenticated (agent-mounted key). If the push is rejected
           for auth, skip it and explain why in the `skipped` field of your final json
           block — do not retry with credentials.
        {{- else }}
        1. Push the branch. The origin remote has no credentials — derive <owner>/<repo>
           from `git remote get-url origin` and push with a one-shot token URL:
           git push "https://x-access-token:${GH_TOKEN}@github.com/<owner>/<repo>.git" feature/{{ $slug }}
           Never write the token into git config or the remote URL; if GH_TOKEN is unset,
           skip the push and explain why in the `skipped` field of your final json block.
        {{- end }}
        2. Open a pull request with the github MCP tool create_pull_request. If NO github
           MCP tool is callable in this session (an agent CLI that loads no MCP config —
           codex on the local substrate — has none, and asking for it to be installed
           changes nothing), use the GitHub CLI over the same token instead:
           `gh pr create --base <base> --head feature/{{ $slug }} --title <title> --body-file <file>`
           (write the body to a scratch file first; `gh` reads GH_TOKEN from the
           environment), or, with no `gh` on PATH, the REST API:
           `curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/<owner>/<repo>/pulls`
           with a json body `{title, head, base, body}`. A missing MCP tool is NOT a
           reason to skip: the branch is already pushed, and a driver expects a PR
           (2026-09-04: a codex run pushed, reported `skipped: GitHub MCP tool not
           installed`, and the PR had to be opened by hand). Its BASE is
           `{{ include "h.token" "params.baseBranch" }}` — when that is empty use the
           repository's default branch, and when it names a branch pass it as the tool's
           `base` argument so the PR targets that branch instead. Do not retarget an
           existing PR you did not open in this run.
           Title from the feature, body from the plan file
           and the implementation commit (summarize what the implementation step committed).
           Include the `===VERIFY EVIDENCE===` block below in the PR body VERBATIM, as a
           fenced json block under an "## Evidence" heading, when it is non-empty (verify
           was composed in): it is the implementation step's validated report — baseline
           and final exit codes and failure counts, the gate verdict, every extra check —
           and a driver reads those numbers from the PR, not from your prose. Do not
           summarise or reformat it, and do not omit it (2026-09-02: a run did every check
           the spec asked for and the PR body carried none of it).
           Everything the implementation step OBSERVED that belongs in the PR is in that
           block — including any `demonstrations` (a check deliberately made to fail, with
           the lines it printed). Never write out command output you did not run in THIS
           step: if the spec asked for a demonstration and the block carries none, say so
           in one line rather than reconstructing what it probably printed (2026-09-03: a
           PR body quoted a failing test by the wrong number, at the wrong line, in a
           format the runner does not emit — it was invented).
           Include the `===ITEST EVIDENCE===` section below in the PR body when those values
           are non-empty (i.e. when run-itest was composed in and ran).
           Pass the intended Markdown directly as the tool's body value, beginning with the intended heading or first line;
           do not wrap it in shell command substitution or a heredoc.
           If the value under ===ISSUE=== above is a number N, include the line
           `Closes #N` on its own line in the PR body, so the merge auto-closes that issue;
           otherwise omit it. If a PR for this branch already exists, your push has updated
           it — do not open a duplicate.
           AFTER opening or finding the PR, read it back (pull_request_read, or
           `gh pr view <number> --json number,url,baseRefName,headRefName,body` on the CLI
           path) and report its `base` and `head` branches from that response in your json
           block. In `closes`, report every integer N appearing as a `Closes #N` line in
           the BODY of that read-back response, or `[]` if there is none. Never copy the
           requested base or issue number into the block: the values must be what GitHub
           holds, because `base` catches a PR opened against the wrong branch and `closes`
           catches a dropped `Closes` line; echoing the ===ISSUE=== value would make that
           check useless (2026-09-01: the base was in prose only, and a driver could not
           tell a retargeted PR from a correct one without opening each).

        ===VERIFY EVIDENCE===
        {{ include "h.token" "implement.structured" }}

        ===ITEST EVIDENCE===
        class: {{ include "h.token" "itest.class" }}
        treeHash: {{ include "h.token" "itest.treeHash" }}
        durationMs: {{ include "h.token" "itest.durationMs" }}
        outputTail: {{ include "h.token" "itest.outputTail" }}
        Include this evidence section in the PR body only when these values are non-empty
        (itest was composed in and ran).

        3. If a PR for this branch already existed before this push (this is a revise
           run, not a first-time creation), respond to review feedback:
           a. Find the PR number: use the github MCP tool to list pull requests by
             head branch feature/{{ $slug }} (CLI path: `gh pr list --head feature/{{ $slug }} --json number`;
             the thread steps below then go through `gh api graphql` — `resolveReviewThread`
             takes the same PRRT_ node id).
           b. Fetch UNRESOLVED review threads: pull_request_read with method
             get_review_comments on that PR. Each thread has an isResolved field, a
             thread node id (PRRT_...), and comments with numeric ids.
           c. For each unresolved thread that this run actually addressed, reply inline
             with add_reply_to_pull_request_comment (body: "Addressed in <sha>:
             <what changed>"), then resolve it with pull_request_review_write method
             resolve_thread passing the thread node id.
           d. Do NOT reply to or resolve threads this run did not address.
           e. Never APPROVE or REQUEST_CHANGES on the PR.
        Report the PR (number + URL) — or why it was skipped — ONLY via the fields of
        your final json block below; there is no other reporting channel.
        {{ include "h.outputContractEpilogue" $contract | nindent 8 }}
outputs:
  {{- include "h.contract.create-pr" . | nindent 2 }}
{{- end }}
