{{- /*
create-pr overlay template — the commit / push / open-PR / respond-to-review epilogue as an
overlay fragment.

This is a SPATIAL-composition (overlay) atom, not a standalone workflow: it renders a single
`implement` step carrying only the PR epilogue. Overlaid onto a composable feature definition
(rendered with composable=true, which ends its implement step neutrally at the plan), the merge-by-id
extends implement's task with this epilogue — producing `feature ⊕ create-pr`. Composing create-pr
IS the intent to open a PR: there is no opt-in flag (the retired `feature --pr`/`createPr` nuance is
gone). If you want a PR, you compose one in.

Publish-native: slug / issueNumber are {{params.*}} engine tokens resolved at fire time. Only gitAuth
bakes from values at publish time (a secret-adjacent knob, never a fire-time param). issueNumber is
optional — provide it (`-p issueNumber=N`) for a `Closes #N` PR body; omit it for a PR that closes no
issue.

Compose (the intended path):
  h template compose implement create-pr --save feature-pr
Render alone (for inspection):
  helm template create-pr cli/charts/workflows -s templates/create-pr.tmpl.yaml --set template=create-pr
*/ -}}
{{- /*
The declared output contract (structured-workflow-outputs plan): the workflow's typed output
signature, rendered three ways below — the step's outputContract input (validated at the run
activity, rung 2), the schema-derived task epilogue (steering that cannot drift), and the
top-level outputs: block (the registration surface). No `required`: a run that cannot open a PR
reports `skipped` instead of pr/url, and the chain fails loud downstream exactly like the
marker-era SKIPPED tail.
*/ -}}
{{- define "h.contract.create-pr" -}}
type: object
properties:
  pr:
    type: integer
    description: the pull request number, when a PR exists (opened, updated, or pre-existing)
  url:
    type: string
    description: the pull request URL
  skipped:
    type: string
    description: present INSTEAD of pr/url — why no PR exists (verify gate failed, auth failure, nothing to push, ...)
  verify:
    enum:
      - PASS
      - FAIL
    description: the acceptance-gate outcome, present when a verify gate is composed in (verify.yaml); FAIL means the gate stopped the run before any PR step
{{- end }}
{{- /* Template gate — see implement.tmpl.yaml: bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "create-pr" }}
role: overlay
{{- $c := .Values.createPr }}
{{- $slug := include "h.token" "params.slug" }}
{{- $issueNumber := include "h.token" "params.issueNumber" }}
{{- $contract := include "h.contract.create-pr" . | fromYaml }}
steps:
  - id: implement
    input:
      outputContract: {{ $contract | toJson }}
      task: |-
        ===ISSUE===
        {{ $issueNumber }}

        Now commit what you implemented and open (or update) a pull request.
        1. Commit ONLY what the feature touched, on branch feature/{{ $slug }}, with a
           concise conventional commit message. Add files individually (never `git add -A`
           or `git commit -a`). Two harness artifacts must NEVER ship: restore the runner's
           MCP merge with `git checkout -- .mcp.json` (when the repo tracks that file), and
           leave plan-feature-{{ $slug }}.md uncommitted (run context, not feature code).
        {{- if eq ($c.gitAuth | default "") "ssh" }}
        2. Push the branch: git push origin feature/{{ $slug }} — the origin remote's SSH
           transport is already authenticated (agent-mounted key). If the push is rejected
           for auth, skip it and explain why in the `skipped` field of your final json
           block — do not retry with credentials.
        {{- else }}
        2. Push the branch. The origin remote has no credentials — derive <owner>/<repo>
           from `git remote get-url origin` and push with a one-shot token URL:
           git push "https://x-access-token:${GH_TOKEN}@github.com/<owner>/<repo>.git" feature/{{ $slug }}
           Never write the token into git config or the remote URL; if GH_TOKEN is unset,
           skip the push and explain why in the `skipped` field of your final json block.
        {{- end }}
        3. Open a pull request against the repository's default branch with the github
           MCP tool create_pull_request: title from the feature, body summarizing the
           spec, the plan, and what you implemented. Pass the intended Markdown directly
           as the tool's body value, beginning with the intended heading or first line;
           do not wrap it in shell command substitution or a heredoc. If the value under
           ===ISSUE=== above is a number N, include the line `Closes #N` on its own line
           in the PR body, so the merge auto-closes that issue; otherwise omit it. If a
           PR for this branch already exists, your push has updated it — do not open a
           duplicate.
        4. If a PR for this branch already existed before this push (this is a revise
           run, not a first-time creation), respond to review feedback:
           a. Find the PR number: use the github MCP tool to list pull requests by
             head branch feature/{{ $slug }}.
           b. Fetch UNRESOLVED review threads: pull_request_read with method
             get_review_comments on that PR. Each thread has an isResolved field, a
             thread node id (PRRT_...), and comments with numeric ids.
           c. For each unresolved thread that this run actually addressed, reply inline
             with add_reply_to_pull_request_comment (body: "Addressed in <sha>:
             <what changed>"), then resolve it with pull_request_review_write method
             resolve_thread passing the thread node id.
           d. Do NOT reply to or resolve threads this run did not address.
           e. Never APPROVE or REQUEST_CHANGES on the PR.
        Report the PR (number + URL) — or why it was skipped — ONLY via the fields of
        your final json block below; there is no other reporting channel.
        {{ include "h.outputContractEpilogue" $contract | nindent 8 }}
outputs:
  {{- include "h.contract.create-pr" . | nindent 2 }}
{{- end }}
