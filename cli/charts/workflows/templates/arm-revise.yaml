{{- /*
arm-revise overlay template — the "arm at birth" step (docs/plans/workflow-watcher-registry.md §10,
Job 2). Composed onto feature ⊕ verify ⊕ create-pr, it appends a NEW step (`arm-revise`, a new id, so
it lands after `implement`) that registers a revise-until-merged RECUR cron for the PR the run just
opened. This is the `arm-*` pattern: a workflow arms its own follow-on recurrence via an activity
(sibling of write-wf-row), not the fire edge — the recurrence still lives in the cron engine; this
step only writes the cron:sub row (LOUD on failure, so a botched arm records wf:failed).

Guard: the register-cron activity only arms if `implement`'s structured output block carries a `pr`
URL — a create-pr run that SKIPPED the push opens no PR and arms nothing (a valid no-op).

Compose (the intended path — the h-builds-h feature-pr key):
  h template compose feature verify create-pr arm-revise --save feature-pr
Render alone (for inspection):
  helm template arm-revise cli/charts/workflows -s templates/arm-revise.yaml --set template=arm-revise
*/ -}}
{{- /* Template gate — see feature.yaml: bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "arm-revise" }}
{{- $a := .Values.armRevise | default dict }}
{{- $cadence := $a.cadence | default "0 */6 * * *" }}
{{- $maxFires := $a.maxFires | default 20 }}
steps:
  - id: arm-revise
    activity: register-cron
    input:
      # The saved workflow the cron re-fires each due tick until the PR merges (revise reports
      # a structured `goal: RESOLVED` on merge; the cron engine reads wf:*.resolved and deactivates).
      workflow: revise
      repo: {{ include "h.token" "params.repo" | quote }}
      slug: {{ include "h.token" "params.slug" | quote }}
      cadence: {{ $cadence | quote }}
      maxFires: {{ $maxFires }}
      # Only arm if the PR actually opened: register-cron reads the `pr` field of this output's json block.
      requirePrFrom: {{ include "h.token" "implement.output" | quote }}
{{- end }}
