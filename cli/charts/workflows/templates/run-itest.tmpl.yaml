{{- /*
run-itest overlay template — appends a machine-executed integration-test step as a pre-PR gate
.
The implement step commits locally (no push, no PR); run-itest runs the integration test; a nonzero
exit fails the workflow HERE — the create-pr step never fires, so no PR is opened for a failed run.
In the composed order: implement → itest → create-pr → arm-revise-pr. Set itest.skip=true as a
break-glass when the cluster is unavailable; the skip is surfaced in the evidence, never silently
hidden.

Compose (the intended path):
  h template compose implement verify run-itest create-pr arm-revise-pr --save implement-pr
Render alone (for inspection):
  helm template run-itest cli/charts/workflows -s templates/run-itest.tmpl.yaml --set template=run-itest
*/ -}}
{{- /* Template gate — bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "run-itest" }}
role: overlay
summary: Overlay — append the k8s integration-test gate before the PR step.
{{- $t := .Values.itest | default dict }}
{{- $skip := $t.skip | default false }}
{{- $skipReason := $t.skipReason | default "break-glass: itest.skip=true set in template values" }}
steps:
  - id: itest
    activity: run-itest
    input:
      {{- if $skip }}
      skip: true
      skipReason: {{ $skipReason | quote }}
      {{- else }}
      worktreePath: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- end }}
      traceparent: {{ include "h.token" "traceparent" | quote }}
{{- end }}
