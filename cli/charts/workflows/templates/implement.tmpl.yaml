{{- /*
feature workflow — worktree → setup → plan → implement.

Renders a run_workflow request body: a run-specific worktree
of the pre-cloned target repo on branch feature/<slug>, h skills + runtime steering installed,
a read-only plan pass over the spec, then an implement pass that leaves the result as
uncommitted working-tree changes.

feature is a pure atom: it does NOT verify and does NOT open a PR — both are separate, explicit
compositions. Overlay the verify template to gate the run on an acceptance check, and the create-pr
template to commit/push/open a PR: `h template compose implement verify create-pr` (create-pr
last — it is the finishing move, gated by verify's "stop on FAIL"). There is no verifyCmd or
--pr/createPr flag: if you want a check or a PR, you compose one in. See
docs/plans/workflow-composition.md.

Render (YAML is the artifact; JSON only at the wire boundary — see cli/scripts/_render.sh):
  helm template implement cli/charts/workflows -s templates/implement.tmpl.yaml \
    --set implement.slug=dark-mode --set-file implement.spec=./dark-mode.md

Publish mode (--set publish=true): instead of literal slug/spec values, the per-run inputs are
emitted as {{params.slug}} / {{params.spec}} engine tokens and the top-level instanceId is
omitted — the render becomes a *template*: a parameterized definition for save_workflow, fired
later with run_saved_workflow + fire-time params. Template config (clonePath, models,
verifyCmd) still bakes in from values at publish time.
*/ -}}
{{- /* Template gate: helm evaluates every template even under -s, so each template's body (and
its `required` calls) only runs when the renderer selects it via --set template=<name>. */ -}}
{{- if eq (.Values.template | default "") "implement" }}
role: base
{{- $f := .Values.implement }}
{{- $publish := .Values.publish | default false }}
{{- /* Composable (overlay) mode: render feature as an overlay-able atom — implement ends neutrally
at the plan (no standalone commit-decision closer) so verify/create-pr overlays can append their
prose to its tail. See docs/plans/workflow-composition.md. `h template compose` sets this. */ -}}
{{- $composable := .Values.composable | default false }}
{{- /* The activity that runs the plan/implement steps — run-claude by default, or run-openhands
to drive the flow on the openhands-agent. Both take the same {cwd,model,task} input. */ -}}
{{- $runActivity := .Values.runActivity | default "run-claude" }}
{{- /* Fire-time identity (docs/plans/chain-composition-surface.md §1.9): in publish mode the
identity fields are emitted as {{params.*}} engine tokens and the values above become stored
DEFAULTS (the params block below), overridable per fire (`-p runActivity=run-openhands`) or per
chained workflow (`--agent`). A non-publish render bakes the literals exactly as before. */ -}}
{{- /* $activityRef is emitted UNQUOTED (a bare literal parses fine; a {{token}} must carry its
own quotes or YAML reads `{{` as a flow mapping), so the publish branch pre-quotes it and the
non-publish render stays byte-identical to the pre-params-era output. */ -}}
{{- $activityRef := $runActivity }}
{{- $agentIdRef := .Values.agentId }}
{{- if $publish }}
{{- $activityRef = include "h.token" "params.runActivity" | quote }}
{{- $agentIdRef = include "h.token" "params.agentId" }}
{{- end }}
{{- $slug := "" }}
{{- $spec := "" }}
{{- if $publish }}
{{- $slug = include "h.token" "params.slug" }}
{{- $spec = include "h.token" "params.spec" }}
params:
  runActivity: {{ $runActivity | quote }}
  agentId: {{ .Values.agentId | quote }}
  {{- /* wf-registry identity (owner/name) — a stored default; -p repo=… overrides per fire.
  Identity only: no step reads it (the worktree cuts from clonePath, the push derives owner/repo
  from the git remote). Omitted when empty (opt-in). */ -}}
  {{- with $f.repo }}
  repo: {{ . | quote }}
  {{- end }}
  {{- with $f.models.plan }}
  modelPlan: {{ . | quote }}
  {{- end }}
  {{- with $f.models.implement }}
  modelImplement: {{ . | quote }}
  {{- end }}
{{- else }}
{{- $slug = required "implement.slug is required (--set implement.slug=<slug>)" $f.slug }}
{{- $spec = required "implement.spec is required (--set-file implement.spec=<path.md>)" $f.spec }}
instanceId: {{ printf "feature-%s" $slug | quote }}
{{- end }}
steps:
  - id: worktree
    activity: create-worktree
    input:
      agentId: {{ $agentIdRef | quote }}
      branch: {{ printf "feature/%s" $slug | quote }}
      {{- with $f.clonePath }}
      clonePath: {{ . | quote }}
      {{- end }}
      {{- with $f.remoteBase }}
      remoteBase: {{ . | quote }}
      {{- end }}
      {{- with $f.gitAuth }}
      auth: {{ . | quote }}
      {{- end }}
  - id: setup
    activity: setup
    input:
      agentId: {{ $agentIdRef | quote }}
      setup:
        {{- include "h.setupSteps" . | nindent 8 }}
  - id: plan
    activity: {{ $activityRef }}
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.plan }}
      model: {{ ternary (include "h.token" "params.modelPlan") . $publish | quote }}
      {{- end }}
      permissionMode: plan
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.

        First check for a persisted plan from a prior run: if plan-feature-{{ $slug }}.md
        exists in the worktree root, read it — if it still matches the spec and the code,
        reuse it as your plan instead of re-investigating.

        Otherwise investigate the feature request under ===FEATURE SPEC=== below: explore the
        relevant code and produce an implementation plan. Do NOT write code or modify any
        files. If the feature already appears implemented, say so in the plan.
        End your response with the plan under the exact marker ===IMPLEMENTATION PLAN===.

        ===FEATURE SPEC===
        {{- $spec | nindent 8 }}
  - id: implement
    activity: {{ $activityRef }}
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.implement }}
      model: {{ ternary (include "h.token" "params.modelImplement") . $publish | quote }}
      {{- end }}
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.

        First persist the plan you were handed under ===IMPLEMENTATION PLAN=== (the
        shared-context handoff, so a re-run or another session can pick it up — the planning
        agent runs read-only and cannot write it itself):
        1. Write it to plan-feature-{{ $slug }}.md in the worktree root.
        2. Call the dapr MCP tool actor_state_set with actorId 'feature-{{ $slug }}' and key
           'plan', value the plan text — durable in the state store, inspectable from any
           session via actor_state_get.
        If either persistence step fails (e.g. the dapr MCP is unreachable), do NOT fail the
        run — but you MUST say so explicitly in your final output, so the degradation is
        visible instead of silent.

        Then implement the feature described under ===FEATURE SPEC=== below, following the
        plan. If the feature already appears implemented, make no changes and say so.
        {{- if $composable }}{{- /* overlay base: end neutrally; a create-pr overlay appends the closer */}}
        {{- else }}
        Leave the result as uncommitted working-tree changes — do not commit or push.
        {{- end }}

        ===FEATURE SPEC===
        {{- $spec | nindent 8 }}

        ===IMPLEMENTATION PLAN===
        {{- include "h.token" "plan.output" | nindent 8 }}
{{- end }}
