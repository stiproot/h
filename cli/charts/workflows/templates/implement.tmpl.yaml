{{- /*
implement workflow — worktree → setup → plan → implement.

Renders a run_workflow request body: a run-specific worktree
of the pre-cloned target repo on branch feature/<slug>, h skills + runtime steering installed,
a read-only plan pass over the spec, then an implement pass that leaves the result as
uncommitted working-tree changes (standalone) or commits locally without pushing (composable mode).

implement is a pure atom: it does NOT verify and does NOT open a PR — both are separate, explicit
compositions. Overlay the verify template to gate the run on an acceptance check, and the create-pr
template to push/open a PR as a dedicated step after implement commits: `h template compose implement
verify run-itest create-pr arm-revise-pr` (create-pr appends its own step after itest; it is the
finishing move, gated by itest's nonzero-exit fail). In composable mode (--set composable=true),
implement's task ends with commit instructions (no push, no PR) — the create-pr overlay owns those.
There is no verifyCmd or --pr/createPr flag: if you want a check or a PR, you compose one in. See
the overlay composition (ARCHITECTURE.md).

Render (YAML is the artifact; JSON only at the wire boundary — see cli/scripts/_render.sh):
  helm template implement cli/charts/workflows -s templates/implement.tmpl.yaml \
    --set implement.slug=dark-mode --set-file implement.spec=./dark-mode.md

Publish mode (--set publish=true): instead of literal slug/spec values, the per-run inputs are
emitted as {{params.slug}} / {{params.spec}} engine tokens and the top-level instanceId is
omitted — the render becomes a *template*: a parameterized definition for save_workflow, fired
later with run_saved_workflow + fire-time params. Template config (clonePath, models,
verifyCmd) still bakes in from values at publish time.
*/ -}}
{{- /* Template gate: helm evaluates every template even under -s, so each template's body (and
its `required` calls) only runs when the renderer selects it via --set template=<name>. */ -}}
{{- if eq (.Values.template | default "") "implement" }}
role: base
summary: Cut a worktree, plan read-only, then implement a spec (commits stay local).
{{- $f := .Values.implement }}
{{- $publish := .Values.publish | default false }}
{{- /* Composable (overlay) mode: render feature as an overlay-able atom — implement commits locally
without pushing (no PR) so a composed-in create-pr step can own the push and PR opening.
`h template compose` sets this. */ -}}
{{- $composable := .Values.composable | default false }}
{{- /* The activity that runs the plan/implement steps — run-claude by default, or run-openhands
to drive the flow on the openhands-agent. Both take the same {cwd,model,task} input. */ -}}
{{- $runActivity := .Values.runActivity | default "run-claude" }}
{{- /* Fire-time identity: in publish mode the
identity fields are emitted as {{params.*}} engine tokens and the values above become stored
DEFAULTS (the params block below), overridable per fire (`-p runActivity=run-openhands`) or per
chained workflow (`--agent`). A non-publish render bakes the literals exactly as before. */ -}}
{{- /* $activityRef is emitted UNQUOTED (a bare literal parses fine; a {{token}} must carry its
own quotes or YAML reads `{{` as a flow mapping), so the publish branch pre-quotes it and the
non-publish render stays byte-identical to the pre-params-era output. */ -}}
{{- $activityRef := $runActivity }}
{{- $agentIdRef := .Values.agentId }}
{{- if $publish }}
{{- $activityRef = include "h.token" "params.runActivity" | quote }}
{{- $agentIdRef = include "h.token" "params.agentId" }}
{{- end }}
{{- $slug := "" }}
{{- $spec := "" }}
{{- if $publish }}
{{- $slug = include "h.token" "params.slug" }}
{{- $spec = include "h.token" "params.spec" }}
params:
  runActivity: {{ $runActivity | quote }}
  {{- /* Target-repo knob:
  the pre-clone path the worktree cuts from. Values default (empty = the shared <root>/repo);
  fire-time -p clonePath=/workspace/<other-repo> aims the run at another checkout. */}}
  clonePath: {{ $f.clonePath | default "" | quote }}
  {{- /*
  The branch this run's worktree is CUT FROM. Empty keeps the previous behaviour — whatever the
  clone's own checkout resolves to. It became a fire-time param on 2026-09-01, after a batch of
  runs collecting onto an integration branch each silently cut from `main` instead: the clone was
  checked out on the integration branch and every worktree still branched off the default, so run
  N+1 conflicted with everything run N had merged. Like `create-pr`'s baseBranch, the base is a
  property of the CAMPAIGN rather than of the repo, so values cannot answer it. */}}
  remoteBase: {{ $f.remoteBase | default "" | quote }}
  agentId: {{ .Values.agentId | quote }}
  {{- /* wf-registry identity (owner/name) — a stored default; -p repo=… overrides per fire.
  Identity only: no step reads it (the worktree cuts from clonePath, the push derives owner/repo
  from the git remote). Omitted when empty (opt-in). */ -}}
  {{- with $f.repo }}
  repo: {{ . | quote }}
  {{- end }}
  {{- with $f.models.plan }}
  modelPlan: {{ . | quote }}
  {{- end }}
  {{- with $f.models.implement }}
  modelImplement: {{ . | quote }}
  {{- end }}
{{- else }}
{{- $slug = required "implement.slug is required (--set implement.slug=<slug>)" $f.slug }}
{{- $spec = required "implement.spec is required (--set-file implement.spec=<path.md>)" $f.spec }}
instanceId: {{ printf "feature-%s" $slug | quote }}
{{- end }}
steps:
  - id: worktree
    activity: create-worktree
    input:
      agentId: {{ $agentIdRef | quote }}
      clonePath: {{ include "h.token" "params.clonePath" | quote }}
      {{- include "h.worktreeSeed" $ }}
      {{- /* The WRITE checkout strategy: this run's whole point is commits on a named branch. */}}
      checkout:
        kind: branch
        branch: {{ printf "feature/%s" $slug | quote }}
        remoteBase: {{ include "h.token" "params.remoteBase" | quote }}
      {{- with $f.gitAuth }}
      auth: {{ . | quote }}
      {{- end }}
  - id: setup
    activity: setup
    input:
      agentId: {{ $agentIdRef | quote }}
      setup:
        {{- include "h.setupSteps" . | nindent 8 }}
  - id: plan
    activity: {{ $activityRef }}
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.plan }}
      model: {{ ternary (include "h.token" "params.modelPlan") . $publish | quote }}
      {{- end }}
      permissionMode: plan
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.

        First check whether a prior run left anything — you may be a RESUMPTION, and
        re-planning finished work is the most expensive mistake available to you. Three
        places, in order, because they survive different things:
        1. `git log` on this branch. The most reliable: a re-fire reuses the branch, so a
           prior run's COMMITS are here even when its worktree is not.
        2. plan-feature-{{ $slug }}.md in the worktree root. Deliberately uncommitted, so it
           is present when the worktree was reused and ABSENT when a fresh one was cut —
           read it if it is there, and do not conclude from its absence that nothing was done.
        3. ONLY if the dapr MCP is wired here: actor_state_get with actorId
           'feature-{{ $slug }}' and key 'plan'. That is where a prior run's plan text
           survives a fresh worktree; on the LOCAL substrate there are no services and so no
           dapr MCP, and (1) plus (2) are the whole story — skipping this is EXPECTED, not a
           degradation.
        If what you find still matches the spec and the code, reuse it instead of
        re-investigating. Verify a claim cheaply against the tree before trusting it.

        Otherwise investigate the feature request under ===FEATURE SPEC=== below: explore the
        relevant code and produce an implementation plan. Do NOT write code or modify any
        files. If the feature already appears implemented, say so in the plan.
        End your response with the plan under the exact marker ===IMPLEMENTATION PLAN===.

        ===FEATURE SPEC===
        {{- $spec | nindent 8 }}
  - id: implement
    activity: {{ $activityRef }}
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.implement }}
      model: {{ ternary (include "h.token" "params.modelImplement") . $publish | quote }}
      {{- end }}
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.

        First persist the plan you were handed under ===IMPLEMENTATION PLAN=== (the
        shared-context handoff, so a re-run or another session can pick it up — the planning
        agent runs read-only and cannot write it itself):
        1. Write it to plan-feature-{{ $slug }}.md in the worktree root. This is the handoff
           and it is required. It is PER-RUN CONTEXT, not a tracking log: do NOT give it a
           progress/status section. If the repository keeps its own plan or tracking doc for
           this work, THAT doc is the authoritative record of what is done and what is next
           — read it first and keep it current; this file only carries the plan itself. (A
           scratch file carrying its own empty "Progress log" heading has shadowed a repo's
           real one and cost a whole pass, because the reader saw an empty log and concluded
           nothing had been done.)
        2. ONLY if the dapr MCP is wired in this environment, ALSO call actor_state_set with
           actorId 'feature-{{ $slug }}' and key 'plan', value the plan text — durable in the
           state store, inspectable from another session via actor_state_get. On the LOCAL
           substrate there are no services and so no dapr MCP: the file from (1) sits on the
           operator's own disk and is the whole handoff there, so skipping this is EXPECTED,
           not a degradation — do not attempt the call and do not report its absence.
        If (1) fails, or (2) fails while the tool IS present, do NOT fail the run — but you
        MUST say so explicitly in your final output, so a real degradation stays visible.

        Then implement the feature described under ===FEATURE SPEC=== below, following the
        plan. If the feature already appears implemented, make no changes and say so.
        {{- if $composable }}
        COMMIT AS YOU GO — you have a wall-clock budget and may not finish.
        After each coherent unit of work (a migration, a module, one component),
        commit ONLY what that unit touched on branch feature/{{ $slug }}, with a
        concise conventional commit message. Add files individually (never
        `git add -A` or `git commit -a`). Do not hold a large uncommitted diff
        hoping to finish: a run that stops mid-edit with nothing committed loses
        everything it paid for, while small honest commits are a resumable asset.
        If you run short of time, stop, commit what works, record where you got
        to and what is next, and finish cleanly rather than leaving the tree dirty. Two harness artifacts must NEVER
        ship: restore the runner's MCP merge with
        `git checkout -- .mcp.json` (when the repo tracks that file), and
        leave plan-feature-{{ $slug }}.md uncommitted (run context, not
        feature code).
        Do NOT push the branch and do NOT open a pull request — a
        composed-in create-pr step owns those.
        {{- else }}
        COMMIT AS YOU GO on branch feature/{{ $slug }}, at a sensible cadence — after each
        coherent unit of work (a migration, a module, one component), never after every file
        edit. Add files individually (never `git add -A` or `git commit -a`), and leave
        plan-feature-{{ $slug }}.md uncommitted (run context, not feature code).
        Do NOT push the branch and do NOT open a pull request — this run stops at the local
        branch, and the operator decides what happens to it.
        (Committing costs the reader nothing: this is a worktree, so the change is
        `git diff <base>...HEAD` either way. Leaving it uncommitted only meant that a step
        killed at its wall-clock deadline lost everything it had paid for.)
        {{- end }}

        ===FEATURE SPEC===
        {{- $spec | nindent 8 }}

        ===IMPLEMENTATION PLAN===
        {{- include "h.token" "plan.output" | nindent 8 }}
{{- end }}
