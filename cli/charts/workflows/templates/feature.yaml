{{- /*
feature workflow — worktree → setup → plan → implement (→ verify).

Renders a run_workflow request body (WORKFLOWS.md "Feature request"): a run-specific worktree
of the pre-cloned target repo on branch feature/<slug>, h skills + runtime steering installed,
a read-only plan pass over the spec, then an implement pass that leaves the result as
uncommitted working-tree changes. When feature.verifyCmd is set, a trailing verify step runs
that command in the worktree and fixes forward until it passes (bounded attempts), ending with
a machine-checkable ===VERIFY=== PASS/FAIL verdict — without it, an implement step's
self-report is an unchecked claim.

feature.createPr appends a commit/push/PR epilogue to the prose of the run's FINAL step
(verify when verifyCmd is set, else implement) — no extra step, no engine conditional: the
agent itself commits the worktree, pushes feature/<slug> with a one-shot $GH_TOKEN URL (never
persisted into git config), and opens the PR via the github MCP, ending with a machine-checkable
===PR=== marker. The epilogue keys off the value under its ===CREATE PR=== heading: a literal
'true' in direct renders (--set feature.createPr=true / `h feature run --pr`); in publish mode
the {{params.createPr}} engine token, so the SAME saved family opts in per run with
-p createPr=true (param absent → resolves to '' → worktree-only run).

Render (YAML is the artifact; JSON only at the wire boundary — see cli/scripts/_render.sh):
  helm template feature cli/charts/workflows -s templates/feature.yaml \
    --set feature.slug=dark-mode --set-file feature.spec=./dark-mode.md

Publish mode (--set publish=true): instead of literal slug/spec values, the per-run inputs are
emitted as {{params.slug}} / {{params.spec}} engine tokens and the top-level instanceId is
omitted — the render becomes a *family*: a parameterized definition for save_workflow, fired
later with run_saved_workflow + fire-time params. Family config (sourceRepo, models,
verifyCmd) still bakes in from values at publish time.
*/ -}}
{{- /* Family gate: helm evaluates every template even under -s, so each family's body (and
its `required` calls) only runs when the renderer selects it via --set family=<name>. */ -}}
{{- if eq (.Values.family | default "") "feature" }}
{{- $f := .Values.feature }}
{{- $publish := .Values.publish | default false }}
{{- /* The value the PR epilogue keys off: publish mode always carries the epilogue with the
fire-time param token; direct mode includes it (as a literal 'true') only when opted in. */ -}}
{{- $createPr := "" }}
{{- if $publish }}
{{- $createPr = include "h.token" "params.createPr" }}
{{- else if $f.createPr }}
{{- $createPr = "true" }}
{{- end }}
{{- /* The GitHub issue this run implements (if any): the PR epilogue adds `Closes #N` so the
merge auto-closes it. Publish mode leaves it open as a fire-time param, like createPr. */ -}}
{{- $issueNumber := "" }}
{{- if $publish }}
{{- $issueNumber = include "h.token" "params.issueNumber" }}
{{- else if $f.issueNumber }}
{{- $issueNumber = $f.issueNumber | toString }}
{{- end }}
{{- $slug := "" }}
{{- $spec := "" }}
{{- if $publish }}
{{- $slug = include "h.token" "params.slug" }}
{{- $spec = include "h.token" "params.spec" }}
{{- else }}
{{- $slug = required "feature.slug is required (--set feature.slug=<slug>)" $f.slug }}
{{- $spec = required "feature.spec is required (--set-file feature.spec=<path.md>)" $f.spec }}
instanceId: {{ printf "feature-%s" $slug | quote }}
{{- end }}
steps:
  - id: worktree
    activity: create-worktree
    input:
      agentId: {{ .Values.agentId | quote }}
      branch: {{ printf "feature/%s" $slug | quote }}
      {{- with $f.sourceRepo }}
      sourceRepo: {{ . | quote }}
      {{- end }}
      {{- with $f.remoteBase }}
      remoteBase: {{ . | quote }}
      {{- end }}
      {{- with $f.gitAuth }}
      auth: {{ . | quote }}
      {{- end }}
  - id: setup
    activity: setup
    input:
      agentId: {{ .Values.agentId | quote }}
      setup:
        {{- include "h.setupSteps" . | nindent 8 }}
  - id: plan
    activity: run-claude
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.plan }}
      model: {{ . | quote }}
      {{- end }}
      permissionMode: plan
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.

        First check for a persisted plan from a prior run: if plan-feature-{{ $slug }}.md
        exists in the worktree root, read it — if it still matches the spec and the code,
        reuse it as your plan instead of re-investigating.

        Otherwise investigate the feature request under ===FEATURE SPEC=== below: explore the
        relevant code and produce an implementation plan. Do NOT write code or modify any
        files. If the feature already appears implemented, say so in the plan.
        End your response with the plan under the exact marker ===IMPLEMENTATION PLAN===.

        ===FEATURE SPEC===
        {{- $spec | nindent 8 }}
  - id: implement
    activity: run-claude
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.implement }}
      model: {{ . | quote }}
      {{- end }}
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.

        First persist the plan you were handed under ===IMPLEMENTATION PLAN=== (the
        shared-context handoff, so a re-run or another session can pick it up — the planning
        agent runs read-only and cannot write it itself):
        1. Write it to plan-feature-{{ $slug }}.md in the worktree root.
        2. Call the dapr MCP tool actor_state_set with actorId 'feature-{{ $slug }}' and key
           'plan', value the plan text — durable in the state store, inspectable from any
           session via actor_state_get.
        If either persistence step fails (e.g. the dapr MCP is unreachable), do NOT fail the
        run — but you MUST say so explicitly in your final output, so the degradation is
        visible instead of silent.

        Then implement the feature described under ===FEATURE SPEC=== below, following the
        plan. If the feature already appears implemented, make no changes and say so.
        {{- if and $createPr (not $f.verifyCmd) }}
        Leave the result as working-tree changes while you work; whether the run ends
        committed, pushed, and opened as a PR is decided under ===CREATE PR=== below.

        ===CREATE PR===
        {{ $createPr }}

        ===ISSUE===
        {{ $issueNumber }}

        The value under ===CREATE PR=== above decides how this run ends. If it is not
        exactly 'true', leave everything as uncommitted working-tree changes — do not
        commit or push. If it IS 'true':
        1. Commit ONLY what the feature touched, on branch feature/{{ $slug }}, with a
           concise conventional commit message. Add files individually (never `git add -A`
           or `git commit -a`). Two harness artifacts must NEVER ship: restore the runner's
           MCP merge with `git checkout -- .mcp.json` (when the repo tracks that file), and
           leave plan-feature-{{ $slug }}.md uncommitted (run context, not feature code).
        {{- if eq ($f.gitAuth | default "") "ssh" }}
        2. Push the branch: git push origin feature/{{ $slug }} — the origin remote's SSH
           transport is already authenticated (agent-mounted key). If the push is rejected
           for auth, skip it and say so under ===PR=== — do not retry with credentials.
        {{- else }}
        2. Push the branch. The origin remote has no credentials — derive <owner>/<repo>
           from `git remote get-url origin` and push with a one-shot token URL:
           git push "https://x-access-token:${GH_TOKEN}@github.com/<owner>/<repo>.git" feature/{{ $slug }}
           Never write the token into git config or the remote URL; if GH_TOKEN is unset,
           skip the push and say so under ===PR===.
        {{- end }}
        3. Open a pull request against the repository's default branch with the github
           MCP tool create_pull_request: title from the feature, body summarizing the
           spec, the plan, and what you implemented. If the value under ===ISSUE===
           above is a number N, include the line `Closes #N` on its own line in the PR
           body, so the merge auto-closes that issue. If a PR for this branch already
           exists, your push has updated it — do not open a duplicate.
        End your response with the exact marker ===PR=== on its own line, then the PR
        URL — or SKIPPED and the reason — on the next line.
        {{- else }}
        Leave the result as uncommitted working-tree changes — do not commit or push.
        {{- end }}

        ===FEATURE SPEC===
        {{- $spec | nindent 8 }}

        ===IMPLEMENTATION PLAN===
        {{- include "h.token" "plan.output" | nindent 8 }}
  {{- if $f.verifyCmd }}
  - id: verify
    activity: run-claude
    input:
      cwd: {{ include "h.token" "worktree.worktreePath" | quote }}
      {{- with $f.models.verify }}
      model: {{ . | quote }}
      {{- end }}
      task: |-
        You are in a git worktree of the target repository, on branch feature/{{ $slug }}.
        A change was just implemented (summary under ===IMPLEMENTED=== below). Verify it:
        run exactly this command in the worktree root:

            {{ $f.verifyCmd }}

        If it fails, diagnose the failure, fix the code, and re-run the command. Repeat
        until it passes or you have made 3 fix attempts. Do not weaken the check (no
        {{- if $createPr }}
        skipping tests, no suppressing errors); commit or push only as directed under
        ===CREATE PR=== below.
        {{- else }}
        skipping tests, no suppressing errors); do not commit or push.
        {{- end }}
        End your response with the exact marker ===VERIFY=== on its own line, then PASS or
        FAIL on the next line, then a short summary of the final command output as evidence.
        {{- if $createPr }}

        ===CREATE PR===
        {{ $createPr }}

        ===ISSUE===
        {{ $issueNumber }}

        The value under ===CREATE PR=== above decides how this run ends. If it is not
        exactly 'true', leave everything as uncommitted working-tree changes. If it IS
        'true' and your verdict is PASS (never open a PR for a failing change):
        1. Commit ONLY what the feature touched, on branch feature/{{ $slug }}, with a
           concise conventional commit message. Add files individually (never `git add -A`
           or `git commit -a`). Two harness artifacts must NEVER ship: restore the runner's
           MCP merge with `git checkout -- .mcp.json` (when the repo tracks that file), and
           leave plan-feature-{{ $slug }}.md uncommitted (run context, not feature code).
        {{- if eq ($f.gitAuth | default "") "ssh" }}
        2. Push the branch: git push origin feature/{{ $slug }} — the origin remote's SSH
           transport is already authenticated (agent-mounted key). If the push is rejected
           for auth, skip it and say so under ===PR=== — do not retry with credentials.
        {{- else }}
        2. Push the branch. The origin remote has no credentials — derive <owner>/<repo>
           from `git remote get-url origin` and push with a one-shot token URL:
           git push "https://x-access-token:${GH_TOKEN}@github.com/<owner>/<repo>.git" feature/{{ $slug }}
           Never write the token into git config or the remote URL; if GH_TOKEN is unset,
           skip the push and say so under ===PR===.
        {{- end }}
        3. Open a pull request against the repository's default branch with the github
           MCP tool create_pull_request: title from the feature, body summarizing the
           spec, the plan, and the verify verdict. If the value under ===ISSUE===
           above is a number N, include the line `Closes #N` on its own line in the PR
           body, so the merge auto-closes that issue. If a PR for this branch already
           exists, your push has updated it — do not open a duplicate.
        After the ===VERIFY=== block, end your response with the exact marker ===PR===
        on its own line, then the PR URL — or SKIPPED and the reason — on the next line.
        {{- end }}

        ===IMPLEMENTED===
        {{- include "h.token" "implement.output" | nindent 8 }}
  {{- end }}
{{- end }}
