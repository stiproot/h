{{- /*
retro workflow — read what a piece of work COST, and file what h should change about it.

The closing member of a feature chain, and the only step whose subject is h itself. Everything
else in a chain works on the target repo; this one works on the RUNTIME that drove it.

Why it exists: across a 7-pass feature arc (2026-08-24) every material defect was found by an
operator running a gate and reading output, and ZERO by an agent's self-report — agents
reported "Completed" on work missing an entire migration, "resolved 54 type errors" with 32
remaining, and "simplify fixtures" for an assertion rewritten to `expect(true).toBe(true)`. A
retro written from the same narrator's memory inherits that optimism. So this step is
DATA-FIRST: it computes from the run ledger, which no agent authored, and every finding must
cite a number or a file. Prose is where self-assessment goes wrong.

Fire-time params:
  branch       the git branch the work ran on (required) — the join key. A group id is minted
               per fire, so N passes at one feature are N groups with nothing tying them
               together; the branch is stable across them by construction.
  repo         target repo of the WORK, for context only — never for issue content
  runActivity  / agentId — fire-time identity (--agent), defaulting to claude

Template config (values, baked at publish time): retro.models.retro, retro.dryRun.

Publish:
  helm template retro cli/charts/workflows -s templates/retro.tmpl.yaml \
    --set template=retro --set publish=true
*/ -}}
{{- define "h.contract.retro" -}}
type: object
required:
  - passes
  - findings
properties:
  passes:
    type: number
    description: distinct fires (ledger groups) observed on this branch
  costUsd:
    type: number
    description: total agent spend across those passes, or omitted when unpriced
  replanShare:
    type: number
    description: >-
      fraction of spend that went to plan/investigation steps rather than doing the work —
      the cost of context that already existed somewhere
  findings:
    type: array
    description: >-
      h-shaped improvements, each with evidence. EMPTY is a valid and common answer.
    items:
      type: object
      required:
        - title
        - evidence
      properties:
        title:
          type: string
          description: imperative, specific, about h — never about the target repo's domain
        evidence:
          type: string
          description: the number or file that supports it; a finding without one is dropped
        issue:
          type: string
          description: issue URL when filed, omitted when dry-run or unfiled
{{- end }}
{{- /* Template gate — see implement.tmpl.yaml: bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "retro" }}
role: standalone
summary: Read a branch's run ledger and file what h should change — data first, h vocabulary only.
{{- $r := .Values.retro }}
{{- $contract := include "h.contract.retro" . | fromYaml }}
{{- $runActivity := .Values.runActivity | default "run-claude" }}
{{- $activityRef := include "h.token" "params.runActivity" | quote }}
params:
  runActivity: {{ $runActivity | quote }}
  agentId: {{ .Values.agentId | quote }}
  {{- with $r.models.retro }}
  modelRetro: {{ . | quote }}
  {{- end }}
steps:
  - id: retro
    activity: {{ $activityRef }}
    input:
      outputContract: {{ $contract | toJson }}
      {{- with $r.models.retro }}
      model: {{ include "h.token" "params.modelRetro" | quote }}
      {{- end }}
      task: |-
        Analyse what the work on branch `{{ include "h.token" "params.branch" }}` cost the
        RUNTIME, and file what h should change. Your subject is h — never the repository the
        work was done on.

        MEASURE FIRST, from the run ledger. Do not reason from memory or from any agent's
        summary; those were wrong often enough that this step exists. The ledger lives under
        $AGENT_RUNS_DIR (default: the `.runs` directory beside the agent workspace root), one
        directory per ledger GROUP, each holding `<agent>-<ts>/summary.json`. Each summary
        carries `branch`, `costUsd`, `durationMs`, `status`, `stopReason` and the step's
        identity. Select every summary whose `branch` matches, then compute:
          - passes      = how many distinct GROUPS those summaries span (one per fire)
          - costUsd     = the sum of costUsd; omit it entirely if nothing was priced, never 0
          - replanShare = spend on plan/investigation steps over total spend
        Note any run whose `status` is failed or whose `stopReason` is a timeout — a pass that
        died at its deadline is the most expensive shape there is.

        THEN derive findings about h, each anchored to something you measured or read. Ask
        what the runtime did that made the work cost more than it should have: passes spent
        re-establishing context that already existed, work lost to a deadline, a template that
        instructed something unhelpful, a refusal that arrived too late, a gate that stayed
        green over a defect. A high pass count or replan share is a symptom — say what in h
        produced it.

        THREE HARD RULES on what you write. They are what make this safe to file publicly:

        1. NO SECRETS. The ledger holds `inputPreview`, `error` strings and paths that can
           carry tokens, credentials and prompt fragments. Never paste ledger text into an
           issue. Quote numbers you computed and file paths inside h; nothing else.
        2. NO DOMAIN DETAIL. h runs on any repository. State every finding in h's own
           vocabulary — templates, steps, substrates, activities, the ledger, guards, chains.
           "The counter trigger misrouted on a null FK" is the target repo's business.
           "A template committed only at the end, so a step killed at its deadline lost all
           its work" is the same incident as an h defect, and is the only version worth
           filing. If a finding cannot be stated without naming the domain, it is not an h
           finding — drop it.
        3. EVIDENCE OR DROP IT. Every finding carries the number or the file that supports
           it. A finding you believe but cannot support is exactly the kind of confident,
           unfounded claim this step was built to stop reproducing.

        FILE what survives, using the `h-issues` skill — follow it for shape and labels, and
        note it refuses to self-apply the trust label. One issue per finding. Put the issue
        URL on the finding. FINDING NOTHING IS A GOOD OUTCOME: a clean run should return an
        empty `findings` array, and inventing work to look thorough is a failure of this step.
        {{- if $r.dryRun }}
        DRY RUN: this run must NOT file anything. Report the findings you would have filed and
        leave `issue` off each one.
        {{- end }}
        {{ include "h.outputContractEpilogue" $contract | nindent 8 }}
outputs:
  {{- include "h.contract.retro" . | nindent 2 }}
{{- end }}
