{{- /*
verify overlay template — an acceptance check prose block that overlays the implement step.

A SPATIAL-composition (overlay) atom: it renders a single `implement` step carrying only the verify
prose, which the overlay merges onto feature's implement step (same id → task extension). So the one
implement agent, after writing the code, runs the acceptance command and fixes forward — no separate
verify step, no second agent (independent review is the downstream pr-review chained workflow, a different
agent). It replaces the retired `implement.verifyCmd`: verification is now only ever composed in.

The check is a prose GATE with a CHECKED REPORT (2026-09-02): on failure the agent halts the implement
step without committing, and either way the step ends with a validated json block — `baseline` and
`final` (command, exitCode, failures) plus a `gate` verdict — so a driver can ASSERT the comparison
(`final.failures <= baseline.failures`, `gate == passed`) instead of reading it out of prose. Night 1
of the trxy campaign (2026-09-01) found every one of nine runs reporting green in prose while the
driver's own re-run disagreed on several; a claim the machine can check is the rung above a claim
it can only read. The block is a STEP contract (`input.outputContract` on the implement step), NOT
a top-level `outputs:` — that block is the composed workflow's one output signature, which create-pr
owns. In the composed implement → itest → create-pr order the composed-in `run-itest` machine gate is
still the structural block — it fails the workflow before `create-pr` fires; verify's prose gate is
the earlier, cheaper signal. Do not compose without run-itest (see docs/h-builds-h-runbook.md).

Config: verify.cmd (the acceptance command, e.g. "bun install && bun run lint") bakes from values at
publish/compose time — it is a property of the target repo, not a per-run input.

Compose (the intended path):
  h template compose implement verify run-itest create-pr arm-revise-pr --save implement-pr
Render alone (for inspection):
  helm template verify cli/charts/workflows -s templates/verify.tmpl.yaml --set template=verify \
    --set verify.cmd="bun run lint"
*/ -}}
{{- define "h.contract.verify-check" -}}
type: object
required: [command, exitCode, failures, commit, dirty]
properties:
  command:
    type: string
    description: the exact command run, from the worktree root
  commit:
    type: string
    description: "`git rev-parse HEAD` at the moment the command ran — for the baseline this MUST be the base branch's head (the driver checks it: a baseline taken after your own edits is not a baseline)"
  dirty:
    type: boolean
    description: "whether `git status --porcelain` printed anything when the command ran — MUST be false for both checks: the baseline is the untouched tree, the final is the committed one"
  exitCode:
    type: integer
    description: the command's exit status
  failures:
    type: integer
    description: how many failing tests / errors / checks the command reported (0 when it passed)
  notes:
    type: string
    description: what failed, in one line — names, not counts (omit when nothing failed)
{{- end }}
{{- define "h.contract.verify" -}}
type: object
required: [baseline, final, gate]
properties:
  baseline:
    description: the floor command run BEFORE any change
{{ include "h.contract.verify-check" . | indent 4 }}
  final:
    description: the SAME floor command run after the work, on the tree you are handing over
{{ include "h.contract.verify-check" . | indent 4 }}
  gate:
    type: string
    enum: [passed, failed, blocked]
    description: "passed: every final failure was already in the baseline (nothing regressed, and the work is committed); failed: a regression YOU introduced remains after 3 attempts (nothing committed); blocked: the baseline itself prevented the work (nothing committed)"
  extraChecks:
    type: array
    description: every further applicable check you ran beyond the floor (lint, type-check, suites) — command, exitCode, and why it covers the change
    items:
      type: object
      required: [command, exitCode]
      properties:
        command:
          type: string
        exitCode:
          type: integer
        why:
          type: string
  demonstrations:
    type: array
    description: every check the spec asked you to make FAIL on purpose (a new test, guard or assertion) — what you changed to break it, the command, and the failing lines the command PRINTED, verbatim (trim to the lines that show the failure; never retype or paraphrase them). Omit only when the spec asked for no demonstration
    items:
      type: object
      required: [what, command, output]
      properties:
        what:
          type: string
          description: the deliberate break, in one line (e.g. "flipped test 21's expected letter to S")
        command:
          type: string
        output:
          type: string
          description: the failing lines exactly as printed, then reverted — the driver compares this against its own re-run
{{- end }}
{{- /* Template gate — see implement.tmpl.yaml: bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "verify" }}
role: overlay
summary: Overlay — add an acceptance-check gate to the implement step.
{{- $v := .Values.verify }}
{{- $cmd := required "verify.cmd is required (--set verify.cmd=<command>)" $v.cmd }}
{{- /* The command is a fire-time param (multi-repo): values supply the default (required so a
render can never silently have no check); -p verifyCmd="bun run verify" retargets per fire. */}}
{{- $contract := include "h.contract.verify" . | fromYaml }}
params:
  verifyCmd: {{ $cmd | quote }}
steps:
  - id: implement
    input:
      outputContract: {{ $contract | toJson }}
      task: |-
        ===ACCEPTANCE CHECK===

        FIRST, BEFORE YOU CHANGE ANYTHING: run the floor command below and record its
        result. This is the BASELINE, and taking it is not optional. Record the commit
        it ran at (`git rev-parse HEAD`) and whether the tree was dirty
        (`git status --porcelain`) — the driver checks that the baseline's commit is the
        base branch's head and the tree was clean. A "baseline" taken after you have
        already written files measures your own unfinished work, not the floor (one run
        reported 2 format failures in files it had just created, and called that the
        baseline); if that happens, say so and take it again from a clean checkout of
        the base (`git stash` / a fresh worktree), never by editing the number.

        A worktree is not guaranteed to start green. A dependency may be declared but
        not installed, a build artifact may be stale, or the branch may simply have
        landed red. If you skip the baseline you cannot tell "my change broke this"
        from "this was already broken" — and the instinct is always to assume the
        former and start fixing code you never touched.

        - If the baseline FAILS: that is a PRE-EXISTING failure. Do NOT try to fix it
          unless the spec explicitly asks you to. Record exactly what failed, then
          judge whether it blocks your work. If it does, STOP and report it — do not
          commit, do not push. If it does not (a failure in an area your change cannot
          reach), you may proceed, but you MUST carry the baseline failures forward and
          say so in your final report.
        - If the baseline PASSES: that is the bar. Your change must leave it passing.

        THEN do the work. AFTERWARDS, run the same command again and COMPARE against
        the baseline you recorded. The comparison is the gate, not the exit code: a
        failure present in both runs is not yours, and a failure present only in the
        second one is. Report both counts.

        The floor command, run in the worktree root:

            {{ include "h.token" "params.verifyCmd" }}

        That is the FLOOR — the minimum command that must run. Do not stop there.
        Read the target repo's own acceptance context (CLAUDE.md, README.md, steering
        docs, and any scripts under `scripts/` or `Makefile`) and determine the FULL
        set of checks that apply to the change you made: lint, type-check, unit tests,
        integration tests, golden updates, or other suites. Run every check that is
        applicable. For each command you run, note what it is and why it covers the
        change.

        If your change touches code and you are skipping all test suites, you MUST
        state that explicitly and justify it — "no tests exist for this module" or
        "the change is documentation-only" are examples of valid justifications; mere
        convenience is not.

        If a command fails with a failure that was NOT in your baseline, diagnose it,
        fix the code, and re-run. Repeat until it passes or you have made 3 fix
        attempts. Do not weaken any check (no skipping tests, no suppressing errors),
        and do not spend attempts on failures your baseline already contained — that is
        someone else's bug, and chasing it is how a run burns its budget without
        touching its task.

        This check GATES everything below it. If commands YOU regressed still fail after
        your attempts, STOP here: do not commit, do not push, do not open a pull request —
        report `gate: failed` in the json block below and halt. If the baseline itself
        blocked the work, report `gate: blocked`. The itest machine gate will also catch
        any locally committed changes that did not pass, but the check here is the
        earlier, cheaper gate.

        If the spec asks you to DEMONSTRATE that a check you introduced can fail (break
        it on purpose, run it, revert), record each such demonstration under
        `demonstrations` in the json block: what you broke, the command, and the failing
        lines it PRINTED — copied from your terminal, not recalled. That block is the only
        route this output has to the pull request: the step that opens the PR runs in a
        separate session, sees nothing you printed, and is forbidden to reconstruct it
        (2026-09-03: a PR body carried a failure transcript with the wrong test number,
        the wrong line and a format the test runner does not print, because the real
        transcript never left the implementing session).

        If it passes, commit per the instructions at the top of this composable section
        (the commit block that appeared before this acceptance check), report
        `gate: passed`, then halt this step — the workflow engine proceeds to the next
        step. `baseline` and `final` MUST be the SAME command; `final` is run on the tree
        you hand over (after the commit, nothing uncommitted). Counts are what the
        command printed, not your judgement of them — the driver re-runs the command and
        compares, so a number that does not reproduce is worse than a failing one.
        {{ include "h.outputContractEpilogue" $contract | nindent 8 }}
{{- end }}
