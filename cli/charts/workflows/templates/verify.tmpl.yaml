{{- /*
verify overlay template — an acceptance check prose block that overlays the implement step.

A SPATIAL-composition (overlay) atom: it renders a single `implement` step carrying only the verify
prose, which the overlay merges onto feature's implement step (same id → task extension). So the one
implement agent, after writing the code, runs the acceptance command and fixes forward — no separate
verify step, no second agent (independent review is the downstream pr-review chained workflow, a different
agent). It replaces the retired `implement.verifyCmd`: verification is now only ever composed in.

The check is a prose GATE: on failure the agent halts the implement step without committing. In the
composed implement → itest → create-pr order, the composed-in `run-itest` machine gate is the
structural block — it fails the workflow before `create-pr` fires; verify's prose gate is the earlier,
cheaper signal. Do not compose without run-itest (see docs/h-builds-h-runbook.md).

Config: verify.cmd (the acceptance command, e.g. "bun install && bun run lint") bakes from values at
publish/compose time — it is a property of the target repo, not a per-run input.

Compose (the intended path):
  h template compose implement verify run-itest create-pr arm-revise-pr --save implement-pr
Render alone (for inspection):
  helm template verify cli/charts/workflows -s templates/verify.tmpl.yaml --set template=verify \
    --set verify.cmd="bun run lint"
*/ -}}
{{- /* Template gate — see implement.tmpl.yaml: bodies only evaluate for the selected template. */ -}}
{{- if eq (.Values.template | default "") "verify" }}
role: overlay
summary: Overlay — add an acceptance-check gate to the implement step.
{{- $v := .Values.verify }}
{{- $cmd := required "verify.cmd is required (--set verify.cmd=<command>)" $v.cmd }}
{{- /* The command is a fire-time param (multi-repo): values supply the default (required so a
render can never silently have no check); -p verifyCmd="bun run verify" retargets per fire. */}}
params:
  verifyCmd: {{ $cmd | quote }}
steps:
  - id: implement
    input:
      task: |-
        ===ACCEPTANCE CHECK===

        FIRST, BEFORE YOU CHANGE ANYTHING: run the floor command below and record its
        result. This is the BASELINE, and taking it is not optional.

        A worktree is not guaranteed to start green. A dependency may be declared but
        not installed, a build artifact may be stale, or the branch may simply have
        landed red. If you skip the baseline you cannot tell "my change broke this"
        from "this was already broken" — and the instinct is always to assume the
        former and start fixing code you never touched.

        - If the baseline FAILS: that is a PRE-EXISTING failure. Do NOT try to fix it
          unless the spec explicitly asks you to. Record exactly what failed, then
          judge whether it blocks your work. If it does, STOP and report it — do not
          commit, do not push. If it does not (a failure in an area your change cannot
          reach), you may proceed, but you MUST carry the baseline failures forward and
          say so in your final report.
        - If the baseline PASSES: that is the bar. Your change must leave it passing.

        THEN do the work. AFTERWARDS, run the same command again and COMPARE against
        the baseline you recorded. The comparison is the gate, not the exit code: a
        failure present in both runs is not yours, and a failure present only in the
        second one is. Report both counts.

        The floor command, run in the worktree root:

            {{ include "h.token" "params.verifyCmd" }}

        That is the FLOOR — the minimum command that must run. Do not stop there.
        Read the target repo's own acceptance context (CLAUDE.md, README.md, steering
        docs, and any scripts under `scripts/` or `Makefile`) and determine the FULL
        set of checks that apply to the change you made: lint, type-check, unit tests,
        integration tests, golden updates, or other suites. Run every check that is
        applicable. For each command you run, note what it is and why it covers the
        change.

        If your change touches code and you are skipping all test suites, you MUST
        state that explicitly and justify it — "no tests exist for this module" or
        "the change is documentation-only" are examples of valid justifications; mere
        convenience is not.

        If a command fails with a failure that was NOT in your baseline, diagnose it,
        fix the code, and re-run. Repeat until it passes or you have made 3 fix
        attempts. Do not weaken any check (no skipping tests, no suppressing errors),
        and do not spend attempts on failures your baseline already contained — that is
        someone else's bug, and chasing it is how a run burns its budget without
        touching its task.

        This check GATES everything below it. If commands YOU regressed still fail after
        your attempts, STOP here: do not commit, do not push, do not open a pull request —
        report the failure in plain output (the check outcome and the baseline comparison;
        no json block is needed from this step) and halt. The itest machine gate will also catch any locally
        committed changes that did not pass, but the check here is the earlier, cheaper gate.

        If it passes, commit per the instructions at the top of this composable section
        (the commit block that appeared before this acceptance check), then halt this
        step — the workflow engine proceeds to the next step.
{{- end }}
