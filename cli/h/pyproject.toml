[project]
name = "h-cli"
version = "0.1.0"
description = "h — the harness CLI (early prototype): chart-rendered workflows, task seeding, workflow-svc reads"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.15",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.scripts]
h = "h_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h_cli"]

[dependency-groups]
dev = [
  "ruff>=0.9",
  "pytest>=8",
  "syrupy>=4",
  "respx>=0.22",
  "pytest-socket>=0.7",
]

[tool.pytest.ini_options]
# Fail-closed network: an unmocked outbound HTTP call in this suite must fail LOUDLY instead of
# reaching a live workflow-svc. A test missing its @respx.mock once registered a REAL chain and
# fired a live review panel on an excluded executor.
# respx-mocked calls never reach a socket; helm renders in a child process (unaffected, offline).
# A test that genuinely needs a socket opts in explicitly with @pytest.mark.enable_socket.
addopts = "--disable-socket"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
