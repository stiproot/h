# Which agent primitives each MODE gets, read by `h workspaces link --profile <name>`.
#
# A profile is the USUAL set for a mode; `--skill`/`--rule` override it per invocation, so one
# workflow can run A with one skill and B with another without editing this file. Same split
# h.pluginSetupSteps already uses: curated config here, the per-run choice at fire time.
#
# `["*"]` means everything on offer. An omitted key means "unselected" (fall back to the default);
# an empty list means "deliberately none", which is how a mode turns something OFF.

[profiles.container]
# A service-substrate run: Dapr, the MCP servers, and a workflow that fired it.
skills = ["*"]
rules = ["h-runtime"]

[profiles.local]
# A local-substrate run: no Dapr and no guaranteed MCP servers, so the runtime rule would be
# describing an environment that is not there. The output-contract instruction a local run does
# depend on rides the step prose itself (h.outputContractEpilogue), not this rule.
skills = ["*"]
rules = []

# Skills whose FILES live elsewhere in this repo. h links them into .h/skills/ so there is one
# copy: the plugin owns delegate-locally and analyze-workflow-run because consumers need them, and
# h reads the same files rather than keeping a second set that would drift.
#
# Declared rather than "everything under plugins/" because that is a SELECTION: use-h and
# author-h-template are consumer-facing and would be noise in h's own sessions.
[sources]
delegate-locally = "plugins/h/skills/delegate-locally"
analyze-workflow-run = "plugins/h/skills/analyze-workflow-run"
