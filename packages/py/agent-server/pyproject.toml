[project]
name = "agent-server"
version = "0.1.0"
description = "Shared FastAPI route boilerplate for h Python agent services (run/setup/dapr-subscribe)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_server"]

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Mirror of the JS packages' `vitest run`: `uv run --package agent-server pytest`.
# asyncio_mode = auto runs `async def test_*` without a per-test marker.
asyncio_mode = "auto"
testpaths = ["tests"]
