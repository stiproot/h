[project]
name = "claude-managed-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "diagrid[claude_agents]",
  "fastapi>=0.129.0",
  "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
