[project]
name = "langgraph-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agent-server",
  "agent-core",
  "langgraph>=1.0",
  "langchain-anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
agent-server = { workspace = true }
agent-core = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.9", "import-linter>=2.1", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Hexagonal-architecture boundary contracts (enforced by `import-linter` — see `make lint-py`).
# The layout is the contract: `domain` is the pure core, `infrastructure` holds outbound
# adapters, `presentation` holds inbound adapters, and `main.py` is the sole composition root.
# Run with `src` on the path so the flat namespace packages resolve as top-level roots.
[tool.importlinter]
root_packages = ["domain", "infrastructure", "presentation"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["domain"]
# domain must not import the adapters, nor any runtime/I-O lib — model the boundary as a
# port (a Protocol in domain) and let the composition root inject the concrete driver.
forbidden_modules = [
  "infrastructure",
  "presentation",
  "fastapi",
  "uvicorn",
  "langgraph",
  "langchain",
  "langchain_anthropic",
]

[[tool.importlinter.contracts]]
name = "adapters are independent"
type = "independence"
# inbound (presentation) and outbound (infrastructure) adapters never import each other;
# they meet only at the composition root, behind domain ports.
modules = ["presentation", "infrastructure"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
