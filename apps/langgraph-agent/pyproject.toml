[project]
name = "langgraph-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agent-server",
  "langgraph>=1.0",
  "langchain-anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
agent-server = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
