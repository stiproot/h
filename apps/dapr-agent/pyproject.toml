[project]
name = "dapr-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agent-server",
  "agent-core[dapr]",
  "uvicorn>=0.30",
  "fastapi>=0.115",
]

[tool.uv.sources]
agent-server = { workspace = true }
agent-core = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8"]

[tool.pytest.ini_options]
# `infrastructure` is a flat namespace package under src/ (mirrors langgraph-agent).
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
