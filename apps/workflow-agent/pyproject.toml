[project]
name = "workflow-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # agent-core[dapr] provides the shared ReAct loop, the OpenAIChatClient adapter, and the
  # workflow-MCP toolset (and, transitively, dapr-agents). httpx stays for the statestore.
  "agent-core[dapr]",
  # agent-server provides the shared HTTP contract main.py imports (WorkflowBabysitter,
  # register_workflow_route). Required at runtime — host mode has the full workspace synced, but
  # the container image only installs declared deps, so this must be explicit.
  "agent-server",
  # OpenTelemetry instrumentation 0.60b1 assumes every partial route match has `.path`.
  # FastAPI 0.137 introduced `_IncludedRouter`, which breaks that assumption on every request.
  "fastapi>=0.115,<0.137",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-zipkin-json>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-server = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.9", "import-linter>=2.1", "pytest>=8.3"]

# Hexagonal-architecture boundary contracts (enforced by `import-linter` — see `make lint-py`).
# The layout is the contract: `domain` is the pure core, `infrastructure` holds outbound
# adapters, `presentation` holds inbound adapters, and `main.py` is the sole composition root.
# Run with `src` on the path so the flat namespace packages resolve as top-level roots.
[tool.importlinter]
root_packages = ["domain", "infrastructure", "presentation"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["domain"]
# domain must not import the adapters, nor any runtime/I-O lib — model the boundary as a
# port (a Protocol in domain) and let the composition root inject the concrete driver.
forbidden_modules = [
  "infrastructure",
  "presentation",
  "fastapi",
  "uvicorn",
  "httpx",
  "dapr",
  "dapr_agents",
]

[[tool.importlinter.contracts]]
name = "adapters are independent"
type = "independence"
# inbound (presentation) and outbound (infrastructure) adapters never import each other;
# they meet only at the composition root, behind domain ports.
modules = ["presentation", "infrastructure"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
