[project]
name = "workflow-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # agent-core[dapr] provides the shared ReAct loop, the OpenAIChatClient adapter, and the
  # workflow-MCP toolset (and, transitively, dapr-agents). httpx stays for the statestore.
  "agent-core[dapr]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-zipkin-json>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[tool.uv.sources]
agent-core = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
