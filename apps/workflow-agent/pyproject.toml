[project]
name = "workflow-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "dapr-agents>=1.0.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-zipkin-json>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
